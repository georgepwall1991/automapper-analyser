name: Corpus Scan

# Runs the shipped analyzers over third-party AutoMapper consumers.
#
# Deliberately NOT a gate. Everything else in CI reads code this project authored - the samples project,
# the test suite, the snapshot baselines - which cannot surface a false positive nobody imagined. The
# IncludeMembers defect fixed in 2.30.88 sat unnoticed through thirty-plus releases for that reason.
#
# A finding here is a lead to triage. Confirmed ones belong in the test suite as permanent regressions,
# not as a threshold enforced here: upstream repositories change for their own reasons, and a corpus that
# can break the build would be silenced within a week.

on:
  workflow_dispatch:
  schedule:
    # Weekly, off-hours. Frequent enough to catch a regression while it is still attributable.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  matrix:
    name: Load corpus manifest
    runs-on: ubuntu-latest
    outputs:
      corpus: ${{ steps.matrix.outputs.corpus }}

    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Render matrix from manifest
        id: matrix
        shell: bash
        run: |
          dotnet restore tools/AnalyzerVerifier/AnalyzerVerifier.csproj
          dotnet build tools/AnalyzerVerifier/AnalyzerVerifier.csproj --no-restore --configuration Release
          corpus=$(dotnet run --project tools/AnalyzerVerifier/AnalyzerVerifier.csproj --configuration Release --no-build -- --print-corpus-matrix)
          echo "corpus=$corpus" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.name }}
    needs: matrix
    runs-on: ubuntu-latest
    # One repository failing to restore or load must not hide findings from the others.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.corpus) }}

    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build verifier
        run: |
          dotnet restore tools/AnalyzerVerifier/AnalyzerVerifier.csproj
          dotnet build tools/AnalyzerVerifier/AnalyzerVerifier.csproj --no-restore --configuration Release

      - name: Checkout corpus repository at pinned SHA
        run: |
          git clone --filter=blob:none "${{ matrix.url }}" corpus-target
          git -C corpus-target checkout --detach "${{ matrix.sha }}"

      - name: Restore corpus target
        run: dotnet restore "corpus-target/${{ matrix.target }}"

      - name: Scan
        run: |
          dotnet run --project tools/AnalyzerVerifier/AnalyzerVerifier.csproj --configuration Release --no-build -- \
            --scan-corpus "corpus-target/${{ matrix.target }}" \
            --output "corpus-report-${{ matrix.name }}.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report-${{ matrix.name }}
          path: corpus-report-${{ matrix.name }}.json
          if-no-files-found: warn
