name: Corpus Scan

# Runs the shipped analyzers over third-party AutoMapper consumers.
#
# Deliberately NOT a gate. Everything else in CI reads code this project authored - the samples project,
# the test suite, the snapshot baselines - which cannot surface a false positive nobody imagined. The
# IncludeMembers defect fixed in 2.30.88 sat unnoticed through thirty-plus releases for that reason.
#
# A finding here is a lead to triage. Confirmed ones belong in the test suite as permanent regressions,
# not as a threshold enforced here: upstream repositories change for their own reasons, and a corpus that
# can break the build would be silenced within a week.

on:
  workflow_dispatch:
  schedule:
    # Weekly, off-hours. Frequent enough to catch a regression while it is still attributable.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.repository.name }}
    runs-on: ubuntu-latest
    # One repository failing to restore or load must not hide findings from the others.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        repository:
          - name: AutoMapper.Collection
            url: https://github.com/AutoMapper/AutoMapper.Collection.git
            sha: 5301edbc689a9696bdd7c396452669434e75989a
            target: src/AutoMapper.Collection.Tests/AutoMapper.Collection.Tests.csproj
          - name: AutoMapper.Extensions.ExpressionMapping
            url: https://github.com/AutoMapper/AutoMapper.Extensions.ExpressionMapping.git
            sha: 5940c8104df8c02ad99d1f47fa8853247ca4869a
            target: tests/AutoMapper.Extensions.ExpressionMapping.Tests/AutoMapper.Extensions.ExpressionMapping.Tests.csproj

    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build verifier
        run: |
          dotnet restore tools/AnalyzerVerifier/AnalyzerVerifier.csproj
          dotnet build tools/AnalyzerVerifier/AnalyzerVerifier.csproj --no-restore --configuration Release

      - name: Checkout corpus repository at pinned SHA
        run: |
          git clone --filter=blob:none "${{ matrix.repository.url }}" corpus-target
          git -C corpus-target checkout --detach "${{ matrix.repository.sha }}"

      - name: Restore corpus target
        run: dotnet restore "corpus-target/${{ matrix.repository.target }}"

      - name: Scan
        run: |
          dotnet run --project tools/AnalyzerVerifier/AnalyzerVerifier.csproj --configuration Release --no-build -- \
            --scan-corpus "corpus-target/${{ matrix.repository.target }}" \
            --output "corpus-report-${{ matrix.repository.name }}.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report-${{ matrix.repository.name }}
          path: corpus-report-${{ matrix.repository.name }}.json
          if-no-files-found: warn
