name: Release to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  package:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow defaults, so everything this job needs is listed.
    # id-token and attestations are required to sign build provenance; the job only reads the
    # repository, so contents stays read even though the workflow default is write.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      package-sha256: ${{ steps.package.outputs.sha256 }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF#refs/tags/v}
          tag=${GITHUB_REF#refs/tags/}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore automapper-analyser.sln

      - name: Build solution
        run: dotnet build automapper-analyser.sln --configuration Release --no-restore -warnaserror

      # Coverage is collected here, not only on branch CI: a v* tag can point at a commit that never
      # ran branch CI, and this is the workflow that publishes. Without collection the gate below has
      # nothing to read and the released artifact would be the one thing never checked.
      - name: Run all tests with code coverage
        run: >-
          dotnet test tests/AutoMapperAnalyzer.Tests/AutoMapperAnalyzer.Tests.csproj
          --configuration Release --no-build --framework net10.0 --verbosity normal
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Enforce declared coverage target
        run: bash scripts/check-coverage.sh

      - name: Verify generated trust artifacts
        run: >-
          dotnet run --project tools/AnalyzerVerifier/AnalyzerVerifier.csproj
          --configuration Release --no-build --
          --check-catalog --check-snapshots --check-compatibility

      - name: Pack analyzer from tag version
        run: >-
          dotnet pack src/AutoMapperAnalyzer.Analyzers/AutoMapperAnalyzer.Analyzers.csproj
          --configuration Release --no-build --output ./nupkg
          /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Verify package contents and checksum
        id: package
        shell: bash
        run: |
          bash scripts/verify-packages.sh ./nupkg
          shopt -s nullglob
          packages=(./nupkg/*.nupkg)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one .nupkg; found ${#packages[@]}." >&2
            exit 1
          fi
          package=${packages[0]}
          echo "sha256=$(sha256sum "$package" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # Attests the exact bytes that were just checksummed, and that the publish job re-verifies against
      # the same digest before pushing.
      #
      # Verify the asset attached to the GitHub release, not the copy downloaded from NuGet: NuGet.org
      # repository-signs packages on upload, which adds a .signature.p7s entry and changes the digest,
      # so the NuGet copy can never match this attestation.
      #   gh release download v<version> --repo georgepwall1991/automapper-analyser --pattern "*.nupkg"
      #   gh attestation verify AutoMapperAnalyzer.Analyzers.<version>.nupkg \
      #     --repo georgepwall1991/automapper-analyser
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ./nupkg/*.nupkg

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg
          retention-days: 90

  compatibility:
    name: Package Compatibility
    needs: package
    uses: ./.github/workflows/package-compatibility.yml
    with:
      artifact-name: nuget-package
      package-sha256: ${{ needs.package.outputs.package-sha256 }}

  publish:
    name: Publish verified package
    needs: [package, compatibility]
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow defaults rather than adding to them, so everything this
    # job needs is listed. contents: write is required by the GitHub release step below - dropping it
    # publishes to NuGet and then fails at release creation.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download verified package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ./nupkg

      - name: Reverify package SHA-256
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./nupkg/*.nupkg)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one .nupkg; found ${#packages[@]}." >&2
            exit 1
          fi
          package=${packages[0]}
          actual=$(sha256sum "$package" | cut -d ' ' -f 1)
          expected='${{ needs.package.outputs.package-sha256 }}'
          if [[ "$actual" != "$expected" ]]; then
            echo "Package SHA-256 mismatch. Expected $expected; got $actual." >&2
            exit 1
          fi
          echo "path=$package" >> "$GITHUB_OUTPUT"

      # Immediately before the push: the issued key is single-use and expires after an hour, so
      # requesting it earlier in the job risks it being dead by the time the push runs.
      - name: NuGet login (OIDC to short-lived key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish exact verified package to NuGet
        run: >-
          dotnet nuget push "${{ steps.package.outputs.path }}"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Generate release notes
        shell: bash
        run: |
          version='${{ needs.package.outputs.version }}'
          if [[ -f CHANGELOG.md ]]; then
            notes=$(sed -n "/## \[$version\]/,/## \[/p" CHANGELOG.md | sed '$d')
          fi
          if [[ -z "${notes:-}" ]]; then
            notes="See CHANGELOG.md for details."
          fi
          {
            printf '%s\n\n' "$notes"
            printf '## Installation\n\n'
            printf '```bash\n'
            printf 'dotnet add package AutoMapperAnalyzer.Analyzers --version %s\n' "$version"
            printf '```\n\n'
            printf '## NuGet Package\n\n'
            printf '📦 [AutoMapperAnalyzer.Analyzers on NuGet](https://www.nuget.org/packages/AutoMapperAnalyzer.Analyzers/%s)\n' "$version"
          } > release_notes.txt

      - name: Create GitHub release from verified package
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          name: Release ${{ needs.package.outputs.version }}
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(needs.package.outputs.version, '-') }}
          files: ${{ steps.package.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
